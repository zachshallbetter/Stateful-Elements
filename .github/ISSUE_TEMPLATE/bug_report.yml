name: Bug report
description: StatefulElement is not behaving as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal reproduction is the fastest path to a fix.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: stateful-elements 1.0.0 (or a commit hash)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened. Quote the README or docs section if relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The markup and script, for example a `div is="stateful-element"` and the calls you made.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: The library needs a browser with customized built-in elements; Safari does not support them.
      placeholder: browser and version, OS
