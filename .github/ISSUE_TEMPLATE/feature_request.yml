name: Feature request
description: Propose a new method, option or change to StatefulElement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        The library is early-stage and small. Tell us the behavior you want and the use case, and
        say whether it should change the public methods of `StatefulElement`.
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should the element do? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: A method, an attribute, an event, a change to existing behavior.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
